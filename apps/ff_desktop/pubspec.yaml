name: ff_desktop
description: Free File Explorer

publish_to: 'none'

version: 0.4.1

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  core:
    path: ../../core_packages/core
  core_ui:
    path: ../../core_packages/core_ui
  l10n:
    path: ../../core_packages/l10n
  theme:
    path: ../../core_packages/theme

  storage:
    path: ../../packages/storage
  utils:
    path: ../../packages/utils

  local_entity_provider:
    path: ../../modules/local_entity_provider
  shortcut:
    path: ../../modules/shortcut

  # Localization.
  intl:
  flutter_localizations:
    sdk: flutter

  # Navigation.
  go_router: ^14.3.0

  # UI - Platform.
  flutter_acrylic: ^1.1.4
  bitsdojo_window: ^0.1.6
  desktop_lifecycle: ^0.1.1
  macos_window_utils: ^1.5.0
  pasteboard: ^0.3.0
  super_drag_and_drop: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/themes/

flutter_gen:
  output: lib/constants/generated/
  line_length: 80
